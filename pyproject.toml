[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpnlookup"
version = "1.0.1"
description = "Local CLI tool for GitHub RAG, Call Graphs, and Codebase querying."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.0.0",
]

[project.scripts]
lookup = "cpnlookup.cli:cli"